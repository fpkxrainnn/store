<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPKxRAINNN — Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #FBE4EC 0%, #FFF7EB 50%, #FDE8EE 100%);
      --card-bg: #FFFFFF;
      --header-pink: #FBD3EA;
      --border-brown: #92736C;
      --divider-line: #EFE3DC;
      --text-brown: #92736C;
      --btn-cream: #FFF9E1;
      --btn-cream-hover: #FFF2C6;
      --btn-pink: #FFD8EF;
      --btn-pink-hover: #FFC4E7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg-gradient);
      font-family: 'Quicksand', 'Prompt', sans-serif;
      color: var(--text-brown);
    }

    /* กรอบหน้าต่างหลัก */
    .window-card {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border: 1.5px solid var(--border-brown);
      border-radius: 6px;
      box-shadow: 0 12px 28px rgba(146, 115, 108, 0.12);
      overflow: hidden;
    }

    /* แถบหัวหน้าต่างสีชมพู */
    .window-header {
      background: var(--header-pink);
      border-bottom: 1.5px solid var(--border-brown);
      padding: 22px 24px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .welcome-text {
      font-size: 22px;
      line-height: 1.3;
      font-weight: 500;
      color: var(--text-brown);
      letter-spacing: 0.3px;
    }

    .window-dots {
      display: flex;
      gap: 8px;
      padding-top: 12px;
    }

    .window-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--border-brown);
      display: inline-block;
    }

    /* ส่วนข้อความแนะนำร้าน */
    .store-info {
      padding: 22px 24px 20px;
      border-bottom: 1px solid var(--divider-line);
    }

    .store-name {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .store-desc {
      font-size: 13.5px;
      font-weight: 400;
      line-height: 1.6;
    }

    /* ส่วนรายการปุ่ม */
    .button-group {
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      border-bottom: 1px solid var(--divider-line);
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 13px 18px;
      border-radius: 6px;
      text-decoration: none;
      color: var(--text-brown);
      font-size: 14px;
      font-weight: 500;
      transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(146, 115, 108, 0.08);
    }

    .nav-btn:active {
      transform: translateY(0);
    }

    .btn-cream {
      background-color: var(--btn-cream);
    }

    .btn-cream:hover {
      background-color: var(--btn-cream-hover);
    }

    .btn-pink {
      background-color: var(--btn-pink);
    }

    .btn-pink:hover {
      background-color: var(--btn-pink-hover);
    }

    .nav-btn svg {
      width: 17px;
      height: 17px;
      stroke: var(--text-brown);
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ส่วนไอคอนโซเชียลด้านล่าง */
    .social-footer {
      padding: 18px 24px 22px;
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .social-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background-color: var(--btn-pink);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-brown);
      text-decoration: none;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .social-btn:hover {
      background-color: var(--btn-pink-hover);
      transform: translateY(-2px);
    }

    .social-btn svg {
      width: 16px;
      height: 16px;
      fill: var(--text-brown);
    }
  </style>
</head>
<body>

  <main class="window-card">
    <!-- ส่วนหัวหน้าต่าง -->
    <header class="window-header">
      <div class="welcome-text">
        (づ｡•ᴗ•｡)づ♡<br>
        Welcome
      </div>
      <div class="window-dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>

    <!-- ข้อมูลร้าน -->
    <section class="store-info">
      <div class="store-name">FPKxRAINNN</div>
      <p class="store-desc">รับออกแบบ และผลิต ทั้งงานจีน และงานไทย</p>
    </section>

    <!-- ปุ่มลิงก์หลัก -->
    <section class="button-group">
      <!-- ปุ่ม 1: Product -->
      <a href="ใส่ลิงก์หน้า_Product_ที่นี่" class="nav-btn btn-cream" target="_blank" rel="noopener">
        <span>Product</span>
        <!-- ไอคอนตะกร้า -->
        <svg viewBox="0 0 24 24">
          <circle cx="9" cy="20" r="1.5"></circle>
          <circle cx="18" cy="20" r="1.5"></circle>
          <path d="M2 3h3l2.4 11.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 1.9-1.5L22 7H6"></path>
        </svg>
      </a>

      <!-- ปุ่ม 2: Status -->
      <a href="ใส่ลิงก์ระบบเช็คสถานะที่นี่" class="nav-btn btn-pink" target="_blank" rel="noopener">
        <span>Status</span>
        <!-- ไอคอนแม่กุญแจ -->
        <svg viewBox="0 0 24 24">
          <rect x="4" y="11" width="16" height="10" rx="2"></rect>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
      </a>

      <!-- ปุ่ม 3: เช็คคิวงานออกแบบ -->
      <a href="ใส่ลิงก์เช็คคิวงานออกแบบที่นี่" class="nav-btn btn-cream" target="_blank" rel="noopener">
        <span>เช็คคิวงานออกแบบ</span>
        <!-- ไอคอนพู่กัน -->
        <svg viewBox="0 0 24 24">
          <path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 10l4.37-4.37a2.12 2.12 0 1 0-3-3Z"></path>
          <path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-5 6-7"></path>
        </svg>
      </a>
    </section>

    <!-- ปุ่มโซเชียลด้านล่าง -->
    <footer class="social-footer">
      <!-- ลิงก์ X (Twitter) -->
      <a href="ใส่ลิงก์_X_ของคุณที่นี่" class="social-btn" aria-label="X" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </a>

      <!-- ลิงก์ LINE -->
      <a href="ใส่ลิงก์_LINE_ของคุณที่นี่" class="social-btn" aria-label="LINE" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24">
          <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
        </svg>
      </a>
    </footer>
  </main>

</body>
</html>
